name: Security check

# Every morning: scripts/security_check.py looks for advisories touching what
# the site runs and repeats the outside test (README, Security check). A
# clean run triggers the deploy (deploy.yml, workflow_run), which writes this
# run's time onto the privacy page. A failure triggers nothing, so the page
# keeps its last clean time, and GitHub emails the failure.
on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC, early morning in the US; off the hour, when schedules queue
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # to find the last clean run, which sets the window

concurrency:
  group: security-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Advisories since the last clean run, so a missed or failed day widens
      # the window rather than skipping it; 48 hours when there's none yet.
      # The token only raises GitHub's API rate limit; the check reads public
      # data and the site's public key, nothing secret.
      - name: Check
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow security-check.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          python scripts/security_check.py ${since:+--since "$since"}
