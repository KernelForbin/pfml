name: Deploy PFML

on:
  push:
    branches: [main]
  workflow_dispatch:
  # After each daily security check, so a clean one's time reaches the
  # privacy page (security-check.yml; README, Security check).
  workflow_run:
    workflows: [Security check]
    types: [completed]
    branches: [main]

# Read-only by default. Only the deploy job, which runs no repo code, gets
# the Pages and token permissions; the build job runs the test suite.
permissions:
  contents: read

# One deploy at a time. A newer push waits rather than cancelling a deploy
# already under way (GitHub's own Pages template does the same).
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to a commit, with the release tag alongside, so a
# moved tag can't change what runs with a Pages token. Bump both together.

# The job timeouts are slack; the per-step ones are the real hang protection,
# because a step's clock starts when the step runs, not when it is queued.
# These jobs finish in about 12 seconds when a runner is free.
#
# Don't raise the job numbers hoping to survive a runner shortage: a queued
# job is cancelled at about 15 minutes whatever they say. Measured during the
# 2026-10-05 Actions outage, zero steps executed both times: build cancelled
# at 15m02s on timeout-minutes: 10, deploy cancelled at 15m02s on 30. See
# CLAUDE.md, Deploy.
jobs:
  build:
    # A failed security check deploys nothing, so the page keeps its last
    # clean time; the skipped build skips the deploy job too.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read   # to look up the last clean security check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, for the features page's commit count

      # The suite is stdlib-only; this pins the version it runs on rather
      # than whatever python3 the runner image ships that month.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # No data build here, on purpose. The site is members-only: season
      # data is built locally and published to a private Supabase bucket by
      # scripts/publish.py, and this public repo holds none of it. What
      # deploys is only the site's HTML, CSS and JS, which contain no league
      # data. A guard fails the deploy if any data file ever slips in.
      # The offline suite (tests/, stdlib only, made-up data) gates every
      # deploy: a failing test means nothing ships. The live tests skip
      # themselves here; they need PFML_LIVE=1.
      # Takes 3 seconds; this only catches a test that hangs.
      - name: Run tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -v

      - name: Refuse to publish league data or secrets
        run: |
          found="$(find site \( -name '*.json' -o -name '*.csv' -o -name '.env*' \) -print)"
          if [ -n "$found" ] || [ -d data ]; then
            echo "League data or secrets found in the deploy (site/**/*.json, *.csv, .env*, or data/). They must not be public."
            echo "$found"; ls -d data 2>/dev/null
            exit 1
          fi

      # Pages tells browsers to keep each file for 10 minutes (max-age=600),
      # so straight after a deploy a new page could run with a cached old
      # app.js or auth.js (it did, 2026-10-19). Every page's own scripts and
      # stylesheet get ?v=<this commit>, in this checkout only; the repo's
      # files stay as they are. scripts/stamp_assets.py says more.
      - name: Stamp scripts and styles with this commit
        run: python scripts/stamp_assets.py site "${GITHUB_SHA::12}"

      # The privacy page says when the daily security check last passed.
      # Every deploy looks it up, so a push never resets it, and the time is
      # in this checkout only, like the stamps above.
      - name: Stamp the last clean security check
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          at="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow security-check.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty')"
          python scripts/stamp_check_time.py site "$at"

      # The features page ends with numbers about how the site is built
      # (commits, lines, tests, deploys, security checks). Counted here, so
      # they're never stale, and in this checkout only, like the stamps
      # above. This deploy isn't a success yet, so the script adds it.
      - name: Stamp the build stats
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploys="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=success&per_page=1" --jq .total_count)"
          checks="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/security-check.yml/runs?status=completed&per_page=1" --jq .total_count)"
          python scripts/stamp_build_stats.py site "$(git rev-list --count HEAD)" "$deploys" "$checks"

      # No configure-pages step: it only reports the site's base URL for
      # static site generators, which plain HTML doesn't need, and it would
      # want Pages access in this job, the one that runs repo code.
      # Leaves out dotfiles (site/.nojekyll among them, which only matters
      # to branch deploys; Actions deploys never run Jekyll).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Takes about 7 seconds; this only catches a Pages call that hangs.
      - id: deployment
        timeout-minutes: 10
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
