name: Deploy PFML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No data build here, on purpose. The site is members-only: season
      # data is built locally and published to a private Supabase bucket by
      # scripts/publish.py, and this public repo holds none of it. What
      # deploys is only the site's HTML, CSS and JS, which contain no league
      # data. A guard fails the deploy if any data file ever slips in.
      - name: Refuse to publish league data
        run: |
          if [ -n "$(find site -name '*.json' -print -quit)" ] || [ -d data ]; then
            echo "League data found in the deploy (site/**/*.json or data/). It must not be public."
            find site -name '*.json'; ls -d data 2>/dev/null
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
