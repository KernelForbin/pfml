<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFML - Watch</title>
<meta name="description" content="A clip for this round, for members.">
<meta name="theme-color" content="#9E00C4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%239E00C4'/><path d='M30 74V26h22a14 14 0 010 28H44v20z' fill='%23F8F9FA'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<!-- TEMPORARY (from 2026-09-28): the round's clip. Every members-only
     page sends people here until they've watched it to the end (the
     check is at the top of auth.js). Removing it is three things: this
     file, that check, and the two media/ files in the bucket. See
     README, "The round clip (temporary)". -->
<body class="gated" data-page="watch">

<header class="topbar">
  <div class="shell topbar-inner">
    <span class="wordmark" id="watchMark">PFML</span>
    <nav class="seasons" id="watchNav" aria-label="Site"></nav>
  </div>
</header>

<main>
  <section class="shell block block-first">
    <div class="watch-stage">
      <video id="watchVideo" class="watch-video" playsinline preload="metadata"></video>
      <button type="button" class="watch-play" id="watchPlay" hidden>
        <span class="watch-play-icon" aria-hidden="true">&#9654;</span>
        <span id="watchPlayLabel">Play with sound</span>
      </button>
      <div class="watch-progress" id="watchProgress" hidden><span class="watch-bar" id="watchBar"></span></div>
    </div>
    <p class="block-note" id="watchNote">Loading the clip&hellip;</p>
  </section>
</main>

<footer class="shell site-footer">
  <p>Members only. This clip is in the league's private storage, not on the public site.</p>
  <p><a href="features">What this site can do</a> &middot; <a href="privacy">Privacy</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="account.js"></script>
<script>
(function () {
  "use strict";
  var CLIP = "media/s3r2-clip.mp4", POSTER = "media/s3r2-poster.jpg";
  var WATCHED = "pfml.clipWatched";          // same key auth.js reads
  var LOCKED_NOTE = "Watch the clip to the end to carry on into the site.";
  var video = document.getElementById("watchVideo");
  var play = document.getElementById("watchPlay");
  var playLabel = document.getElementById("watchPlayLabel");
  var progress = document.getElementById("watchProgress");
  var bar = document.getElementById("watchBar");
  var note = document.getElementById("watchNote");
  var nav = document.getElementById("watchNav");
  var mark = document.getElementById("watchMark");

  function watched() {
    try { return !!localStorage.getItem(WATCHED); } catch (e) { return true; }   // no storage: don't trap anyone
  }
  function remember() {
    try { localStorage.setItem(WATCHED, "1"); } catch (e) { /* nothing to remember it with */ }
  }

  // The two links: dead text until the clip has been watched, real links
  // after, so there's nothing to click past.
  function renderNav() {
    var open = watched();
    var links = [["./", "Home"], ["season3", "Season 3"]];
    nav.innerHTML = links.map(function (l) {
      return open
        ? '<a class="season-tab" href="' + l[0] + '">' + l[1] + "</a>"
        : '<span class="season-tab is-locked" aria-disabled="true" title="' + LOCKED_NOTE + '">' + l[1] + "</span>";
    }).join("");
    if (open) mark.outerHTML = '<a class="wordmark" href="./">PFML</a>';
  }

  function unlock() {
    remember();
    renderNav();
    progress.hidden = true;
    note.textContent = "That's the one. Head in with Home or Season 3 above.";
  }

  renderNav();
  window.PFML.ready.then(function () {
    return Promise.all([PFML.mediaUrl(CLIP), PFML.mediaUrl(POSTER).catch(function () { return null; })]);
  }).then(function (urls) {
    if (urls[1]) video.poster = urls[1];
    video.src = urls[0];
    play.hidden = false;
    note.textContent = watched() ? "You've seen this one. Head in with Home or Season 3 above." : LOCKED_NOTE;

    // No native controls: nothing to drag to the end. Tap to start, tap
    // the picture to pause, and the bar just shows where it's up to.
    play.addEventListener("click", function () {
      video.play().then(function () {
        play.hidden = true;
        progress.hidden = false;
      }).catch(function () {
        note.textContent = "Your browser wouldn't start it. Try tapping again.";
      });
    });
    video.addEventListener("click", function () { if (!video.paused) video.pause(); });
    video.addEventListener("pause", function () {
      if (video.ended) return;
      play.hidden = false;
      playLabel.textContent = "Keep watching";
    });
    video.addEventListener("play", function () { play.hidden = true; });
    video.addEventListener("timeupdate", function () {
      if (video.duration) bar.style.width = (video.currentTime / video.duration * 100) + "%";
    });
    video.addEventListener("ended", unlock);
  }).catch(function (err) {
    // A clip that won't load mustn't lock anyone out of the site.
    unlock();
    note.textContent = "The clip didn't load (" + (err && err.message ? err.message : err) + "), so carry on in.";
  });
})();
</script>
</body>
</html>
