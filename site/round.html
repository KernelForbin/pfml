<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="One round of the PFML Music League: every track, every vote and every comment.">

<body class="gated" data-page="round">

<header class="topbar">

    <a class="wordmark" href="./">PFML</a>
    <nav class="seasons" id="seasonTabs" aria-label="Season"></nav>
  </div>

  <p><a href="features">What this site can do</a> &middot; <a href="privacy">Privacy</a></p>
</footer>

<script src="account.js"></script>

<script src="app.js"></script>
