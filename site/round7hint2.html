<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFML - Round 7, Hint 2</title>
<meta name="description" content="A crossword for PFML members.">
<meta name="theme-color" content="#9E00C4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%239E00C4'/><path d='M30 74V26h22a14 14 0 010 28H44v20z' fill='%23F8F9FA'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="gated" data-page="crossword">

<header class="topbar">
  <div class="shell topbar-inner">
    <a class="wordmark" href="./">PFML</a>
    <nav class="seasons" id="seasonTabs" aria-label="Season"></nav>
  </div>
</header>

<main class="xw-page" id="xwPage">
  <section class="xw-head">
    <div>
      <h1>Round 7, Hint 2</h1>
      <p class="hero-line">A crossword. Pick a square to start; pick it again to switch direction.</p>
    </div>
    <div class="xw-tools">
      <span class="xw-time" id="xwTime" aria-label="Time">0:00</span>
      <button type="button" class="xw-tool" id="xwPause" aria-pressed="false">Pause</button>
      <div class="xw-drop">
        <button type="button" class="xw-tool" id="xwCheck" aria-expanded="false" aria-controls="xwCheckMenu">Check</button>
        <div class="xw-menu" id="xwCheckMenu" hidden>
          <button type="button" data-scope="square">Square</button>
          <button type="button" data-scope="word">Word</button>
          <button type="button" data-scope="puzzle">Puzzle</button>
        </div>
      </div>
      <div class="xw-drop">
        <button type="button" class="xw-tool" id="xwReveal" aria-expanded="false" aria-controls="xwRevealMenu">Reveal</button>
        <div class="xw-menu" id="xwRevealMenu" hidden>
          <button type="button" data-scope="square">Square</button>
          <button type="button" data-scope="word">Word</button>
          <button type="button" data-scope="puzzle">Puzzle</button>
        </div>
      </div>
      <button type="button" class="xw-tool" id="xwClear">Clear</button>
    </div>
  </section>

  <p class="xw-note" id="xwNote" role="status" hidden></p>

  <section class="xw-body">
    <div class="xw-play">
      <div class="xw-board" id="xwBoard">
        <div class="xw-grid" id="xwGrid" role="grid" aria-label="Crossword grid"></div>
        <div class="xw-paused" id="xwPaused" hidden>
          <p>Paused</p>
          <button type="button" class="xw-tool" id="xwResume">Resume</button>
        </div>
      </div>
      <div class="xw-dock">
        <div class="xw-bar">
          <button type="button" class="xw-arrow" id="xwPrev" aria-label="Previous clue">&lsaquo;</button>
          <p class="xw-bar-clue" aria-live="polite"><span class="xw-bar-num" id="xwBarNum"></span><span id="xwBarText"></span></p>
          <button type="button" class="xw-arrow" id="xwNext" aria-label="Next clue">&rsaquo;</button>
        </div>
        <div class="xw-kb" id="xwKb"></div>
      </div>
    </div>

    <div class="xw-lists">
      <section class="xw-list">
        <h2>Across</h2>
        <ol id="xwAcross"></ol>
      </section>
      <section class="xw-list">
        <h2>Down</h2>
        <ol id="xwDown"></ol>
      </section>
    </div>
  </section>
</main>

<footer class="shell site-footer">
  <p>Members only. Your progress stays in this browser.</p>
  <p><a href="features">What this site can do</a> &middot; <a href="privacy">Privacy</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"
        integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="account.js"></script>
<script src="crossword.js"></script>
<script src="app.js"></script>
</body>
</html>
