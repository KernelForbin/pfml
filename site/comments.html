<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFML - Comments</title>
<meta name="description" content="Every vote comment from the PFML Music League, with votes, reactions and replies.">
<meta name="theme-color" content="#9E00C4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%239E00C4'/><path d='M30 74V26h22a14 14 0 010 28H44v20z' fill='%23F8F9FA'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="gated" data-page="comments">

<header class="topbar">
  <div class="shell topbar-inner">
    <a class="wordmark" href="./">PFML</a>
    <nav class="seasons" id="seasonTabs" aria-label="Season"></nav>
  </div>
</header>

<main>
  <section class="shell hero">
    <h1>Comments</h1>
    <p class="hero-line" id="heroLine">Every comment left while voting, one round at a time. Vote on them, react, and reply.</p>
  </section>

  <section class="shell block block-first">
    <div class="cm-controls">
      <label for="cmSeason">Season <select id="cmSeason"></select></label>
      <label for="cmRound">Round <select id="cmRound"></select></label>
      <label for="cmSort">Show <select id="cmSort">
        <option value="track">By track</option>
        <option value="top">Top voted</option>
        <option value="discussed">Most replies</option>
      </select></label>
    </div>
    <div id="cmRoundHead"></div>
    <div id="cmList"><div class="empty">Loading comments.</div></div>
  </section>
</main>

<footer class="shell site-footer">
  <p>Built from Music League's CSV export. Members only. Votes, reactions and replies are visible to every member.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="comments.js"></script>
</body>
</html>
